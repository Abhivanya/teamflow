services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/teamflow
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:8080
      JWT_ACCESS_SECRET: local-compose-access-secret
      JWT_REFRESH_SECRET: local-compose-refresh-secret
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
      - redis

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  uploads:
